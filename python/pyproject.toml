[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relayai-gateway"
dynamic = ["version"]
description = "OpenAI and Anthropic compatible API (with tool calling) for the models in opencode. CLI, server and Python SDK."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mithun Gowda B", email = "mithungowda.b7411@gmail.com" }]
maintainers = [{ name = "Mithun Gowda B", email = "mithungowda.b7411@gmail.com" }]
keywords = ["opencode", "openai", "anthropic", "llm", "gateway", "proxy", "claude-code", "tool-calling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
relayai = "relayai.cli:main"

[project.urls]
Homepage = "https://github.com/mithun50/relayai-gateway"
Documentation = "https://github.com/mithun50/relayai-gateway/blob/main/docs/API.md"
Repository = "https://github.com/mithun50/relayai-gateway"
Issues = "https://github.com/mithun50/relayai-gateway/issues"
Changelog = "https://github.com/mithun50/relayai-gateway/blob/main/CHANGELOG.md"
"npm package" = "https://www.npmjs.com/package/relayai-gateway"

[tool.setuptools.dynamic]
version = { attr = "relayai._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
