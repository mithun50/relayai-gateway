name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # the release workflow runs this exact matrix before publishing

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Make the fake opencode executable
        if: runner.os != 'Windows'
        run: chmod +x conformance/bin/opencode
      - name: Python unit tests
        working-directory: python
        run: python -m unittest discover -s tests -v
      - name: Node unit tests
        working-directory: node
        run: npm test
      - name: Conformance (python)
        run: python conformance/run.py --impl python
      - name: Conformance (node)
        run: python conformance/run.py --impl node

  python-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: chmod +x conformance/bin/opencode
      - working-directory: python
        run: python -m unittest discover -s tests -v
      - run: python conformance/run.py --impl python

  node-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: chmod +x conformance/bin/opencode
      - working-directory: node
        run: npm test
      - run: python conformance/run.py --impl node
