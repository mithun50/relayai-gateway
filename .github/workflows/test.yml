name: syntax

# CI only checks syntax. The full test suites (unit tests and the conformance
# suite) are run locally before every release; see CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # the release workflow runs this before publishing

permissions:
  contents: read

jobs:
  syntax:
    # ubuntu-24.04: the newest runner that still has the oldest supported Python (3.8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"      # oldest supported: catches newer-only syntax
      - uses: actions/setup-node@v4
        with:
          node-version: "18"         # oldest supported: catches newer-only syntax
      - name: Python files compile on Python 3.8
        run: python -m compileall -q python/src python/tests conformance scripts
      - name: JavaScript files parse on Node 18
        run: |
          for f in $(git ls-files 'node/*.js'); do
            node --check "$f" || exit 1
          done
          echo "checked $(git ls-files 'node/*.js' | wc -l) files"
      - name: JSON and version metadata
        run: |
          node -e "JSON.parse(require('fs').readFileSync('node/package.json', 'utf8'))"
          python scripts/release_version.py --check
